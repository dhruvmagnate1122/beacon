name: Legal rule freshness / correction
description: Flag a legal-source, effective-date, applicability, or rule interpretation issue
title: "[rule] "
labels: ["enhancement"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: IN-DPDP-CONSENT
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is stale or incorrect?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Current primary source
      description: Include exact provision / notification / regulator source and effective date.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Applicability / status impact
