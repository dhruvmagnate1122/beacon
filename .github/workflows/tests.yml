name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression tests
        run: python3 scripts/test_check.py
      - name: Exercise India fixture
        run: python3 scripts/check.py examples/minimal-web-app --profile examples/minimal-web-app/profile.json --evidence examples/minimal-web-app/evidence.json > /tmp/beacon-india-report.json
      - name: Exercise EU fixture
        run: python3 scripts/check.py examples/eu-gdpr-readiness --profile examples/eu-gdpr-readiness/profile.json --evidence examples/eu-gdpr-readiness/evidence.json > /tmp/beacon-eu-report.json
